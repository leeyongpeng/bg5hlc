name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 可选：装了 Pillow 才会自动生成 900px 缩略图；装不上也不影响构建。
      - name: Install Pillow (optional)
        continue-on-error: true
        run: python -m pip install --quiet pillow

      - name: Build site
        run: python build.py

      - uses: actions/configure-pages@v5
        with:
          # 首次运行自动开启 Pages（Source = GitHub Actions），省掉手动设置
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
